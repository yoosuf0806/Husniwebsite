<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
<defs>
  <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F2EDE8"/>
    <stop offset="60%" stop-color="#E8E0D8"/>
    <stop offset="100%" stop-color="#C4B8A8"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#C8B898"/>
    <stop offset="100%" stop-color="#A89878"/>
  </linearGradient>
  <linearGradient id="wall_l" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#D8CFC4"/>
    <stop offset="100%" stop-color="#EDE5DC"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFF8EE" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#F0E4CC" stop-opacity="0.2"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="softer"><feGaussianBlur stdDeviation="6"/></filter>
</defs>

<!-- Background room -->
<rect width="600" height="800" fill="url(#room)"/>

<!-- Floor -->
<polygon points="0,520 600,520 600,800 0,800" fill="url(#floor)"/>

<!-- Floor planks -->
<line x1="0" y1="560" x2="600" y2="560" stroke="#B8A888" stroke-width="1" opacity="0.4"/>
<line x1="0" y1="600" x2="600" y2="600" stroke="#B8A888" stroke-width="1" opacity="0.4"/>
<line x1="0" y1="640" x2="600" y2="640" stroke="#B8A888" stroke-width="1" opacity="0.4"/>
<line x1="0" y1="680" x2="600" y2="680" stroke="#B8A888" stroke-width="1" opacity="0.4"/>
<line x1="0" y1="720" x2="600" y2="720" stroke="#B8A888" stroke-width="1" opacity="0.4"/>
<line x1="150" y1="520" x2="120" y2="800" stroke="#B8A888" stroke-width="1" opacity="0.3"/>
<line x1="300" y1="520" x2="280" y2="800" stroke="#B8A888" stroke-width="1" opacity="0.3"/>
<line x1="450" y1="520" x2="440" y2="800" stroke="#B8A888" stroke-width="1" opacity="0.3"/>

<!-- Large window with warm light -->
<rect x="140" y="100" width="320" height="380" fill="#D4E8F0" opacity="0.3"/>
<rect x="140" y="100" width="320" height="380" fill="url(#glow)" opacity="0.6"/>
<!-- Window frame -->
<rect x="140" y="100" width="5" height="380" fill="#8B7355"/>
<rect x="457" y="100" width="5" height="380" fill="#8B7355"/>
<rect x="140" y="100" width="322" height="5" fill="#8B7355"/>
<rect x="140" y="477" width="322" height="5" fill="#8B7355"/>
<rect x="298" y="100" width="4" height="380" fill="#8B7355" opacity="0.7"/>
<rect x="140" y="285" width="322" height="4" fill="#8B7355" opacity="0.7"/>
<!-- Light beam from window -->
<polygon points="145,105 460,105 580,520 20,520" fill="#FFF5E0" opacity="0.12" filter="url(#softer)"/>

<!-- Architectural desk -->
<rect x="60" y="480" width="480" height="12" fill="#6B5540" rx="2"/>
<rect x="60" y="490" width="480" height="6" fill="#5A4532" rx="1"/>
<!-- Desk legs -->
<rect x="80" y="496" width="16" height="80" fill="#5A4532"/>
<rect x="504" y="496" width="16" height="80" fill="#5A4532"/>

<!-- Blueprint/drawing on desk -->
<rect x="100" y="440" width="240" height="170" fill="#F8F4EE" rx="2"/>
<rect x="108" y="448" width="224" height="154" fill="#EEE8E0" rx="1"/>
<!-- Blueprint grid lines -->
<line x1="108" y1="470" x2="332" y2="470" stroke="#1B2A4A" stroke-width="0.8" opacity="0.3"/>
<line x1="108" y1="492" x2="332" y2="492" stroke="#1B2A4A" stroke-width="0.8" opacity="0.3"/>
<line x1="108" y1="514" x2="332" y2="514" stroke="#1B2A4A" stroke-width="0.8" opacity="0.3"/>
<line x1="108" y1="536" x2="332" y2="536" stroke="#1B2A4A" stroke-width="0.8" opacity="0.3"/>
<line x1="108" y1="558" x2="332" y2="558" stroke="#1B2A4A" stroke-width="0.8" opacity="0.3"/>
<line x1="140" y1="448" x2="140" y2="602" stroke="#1B2A4A" stroke-width="0.8" opacity="0.3"/>
<line x1="190" y1="448" x2="190" y2="602" stroke="#1B2A4A" stroke-width="0.8" opacity="0.3"/>
<line x1="240" y1="448" x2="240" y2="602" stroke="#1B2A4A" stroke-width="0.8" opacity="0.3"/>
<line x1="290" y1="448" x2="290" y2="602" stroke="#1B2A4A" stroke-width="0.8" opacity="0.3"/>
<!-- Floor plan on blueprint -->
<rect x="130" y="460" width="80" height="60" fill="none" stroke="#1B2A4A" stroke-width="1.5" opacity="0.6"/>
<rect x="220" y="460" width="50" height="60" fill="none" stroke="#1B2A4A" stroke-width="1.5" opacity="0.6"/>
<rect x="130" y="530" width="140" height="50" fill="none" stroke="#1B2A4A" stroke-width="1.5" opacity="0.6"/>
<!-- Gold dimension lines -->
<line x1="130" y1="455" x2="270" y2="455" stroke="#C9A96E" stroke-width="1"/>
<line x1="128" y1="460" x2="128" y2="580" stroke="#C9A96E" stroke-width="1"/>

<!-- Laptop on desk -->
<rect x="350" y="438" width="160" height="105" fill="#2A3545" rx="6" opacity="0.9"/>
<rect x="358" y="446" width="144" height="90" fill="#1B2A4A" rx="3"/>
<rect x="360" y="448" width="140" height="86" fill="#243552" rx="2"/>
<!-- Screen glow -->
<rect x="362" y="450" width="136" height="82" fill="#2E4470" opacity="0.4"/>
<!-- Screen content lines -->
<rect x="370" y="460" x2="490" y2="460" width="100" height="3" fill="#C9A96E" opacity="0.6" rx="1"/>
<rect x="370" y="468" width="120" height="2" fill="rgba(255,255,255,0.3)" rx="1"/>
<rect x="370" y="474" width="90" height="2" fill="rgba(255,255,255,0.2)" rx="1"/>
<rect x="370" y="480" width="110" height="2" fill="rgba(255,255,255,0.2)" rx="1"/>
<rect x="340" y="543" width="200" height="6" fill="#2A3545" rx="3" opacity="0.8"/>

<!-- Architect sitting - stylised silhouette -->
<!-- Chair -->
<rect x="280" y="395" width="90" height="10" fill="#4A3828" rx="3"/>
<rect x="340" y="390" width="8" height="100" fill="#3A2A1A" rx="2"/>
<rect x="285" y="405" width="80" height="80" fill="#5A4030" rx="4" opacity="0.85"/>
<!-- Person body -->
<rect x="310" y="310" width="44" height="100" fill="#3A4A5A" rx="6" opacity="0.8"/>
<!-- Head -->
<ellipse cx="332" cy="295" rx="26" ry="28" fill="#D4A882"/>
<!-- Hair -->
<ellipse cx="332" cy="277" rx="27" ry="14" fill="#2A1A0A"/>
<rect x="305" y="276" width="54" height="12" fill="#2A1A0A" rx="4"/>
<!-- Arm on desk with pen -->
<path d="M 316 370 Q 300 420 260 455" stroke="#D4A882" stroke-width="12" fill="none" stroke-linecap="round"/>
<path d="M 348 370 Q 360 410 380 445" stroke="#3A4A5A" stroke-width="10" fill="none" stroke-linecap="round"/>
<!-- Pen in hand -->
<line x1="248" y1="460" x2="275" y2="435" stroke="#4A3828" stroke-width="3" stroke-linecap="round"/>

<!-- Desk accessories -->
<!-- Coffee mug -->
<ellipse cx="490" cy="486" rx="18" ry="8" fill="#C8A870" opacity="0.8"/>
<rect x="473" y="455" width="34" height="34" fill="#8B6B4A" rx="4"/>
<path d="M 507 465 Q 520 472 507 479" stroke="#8B6B4A" stroke-width="3" fill="none"/>
<!-- Steam -->
<path d="M 482 450 Q 480 440 483 432" stroke="rgba(200,168,112,0.4)" stroke-width="2" fill="none"/>
<path d="M 490 448 Q 489 438 491 430" stroke="rgba(200,168,112,0.3)" stroke-width="2" fill="none"/>

<!-- Bookshelf on right wall -->
<rect x="510" y="130" width="90" height="350" fill="#6B5040" rx="2" opacity="0.5"/>
<rect x="510" y="130" width="90" height="8" fill="#5A4030"/>
<rect x="510" y="228" width="90" height="8" fill="#5A4030" opacity="0.6"/>
<rect x="510" y="328" width="90" height="8" fill="#5A4030" opacity="0.6"/>
<!-- Books row 1 -->
<rect x="514" y="138" width="16" height="90" fill="#8B3A2A" rx="1"/>
<rect x="532" y="145" width="12" height="83" fill="#2A4A6A" rx="1"/>
<rect x="546" y="140" width="18" height="88" fill="#4A5A2A" rx="1"/>
<rect x="566" y="143" width="14" height="85" fill="#6A4A2A" rx="1"/>
<rect x="582" y="138" width="14" height="90" fill="#3A3A5A" rx="1"/>
<!-- Books row 2 -->
<rect x="514" y="236" width="20" height="92" fill="#5A2A3A" rx="1"/>
<rect x="536" y="242" width="14" height="86" fill="#2A5A4A" rx="1"/>
<rect x="552" y="238" width="16" height="90" fill="#5A5A2A" rx="1"/>
<rect x="570" y="243" width="12" height="85" fill="#4A2A5A" rx="1"/>
<rect x="584" y="236" width="12" height="92" fill="#2A3A2A" rx="1"/>

<!-- Architectural model on shelf -->
<rect x="520" y="336" width="70" height="50" fill="#EDE5DC" opacity="0.7" rx="2"/>
<rect x="530" y="326" width="50" height="12" fill="#E0D8CE" opacity="0.8" rx="1"/>
<rect x="545" y="320" width="20" height="8" fill="#D8CEC4" opacity="0.8" rx="1"/>

<!-- Plant in corner -->
<rect x="0" y="440" width="20" height="80" fill="#5A4030"/>
<ellipse cx="10" cy="440" rx="45" ry="55" fill="#3A5A2A" opacity="0.7"/>
<ellipse cx="10" cy="425" rx="35" ry="40" fill="#4A6B3A" opacity="0.8"/>
<ellipse cx="30" cy="415" rx="25" ry="35" fill="#5A7B4A" opacity="0.7"/>
<ellipse cx="-5" cy="410" rx="28" ry="38" fill="#3A5A28" opacity="0.7"/>

<!-- Pendant light -->
<line x1="300" y1="0" x2="300" y2="80" stroke="#8B7355" stroke-width="2"/>
<ellipse cx="300" cy="85" rx="30" ry="10" fill="#C8A870" opacity="0.9"/>
<ellipse cx="300" cy="88" rx="24" ry="18" fill="#E8C880" opacity="0.8"/>
<ellipse cx="300" cy="200" rx="80" ry="30" fill="#FFF5E0" opacity="0.25" filter="url(#softer)"/>

<!-- Gold accent line at desk level -->
<rect x="0" y="479" width="600" height="2" fill="#C9A96E" opacity="0.3"/>

<!-- Name bar at bottom -->
<rect x="0" y="720" width="600" height="80" fill="#1B2A4A" opacity="0.88"/>
<text x="300" y="750" font-family="Georgia,serif" font-size="13" fill="#C9A96E" text-anchor="middle" letter-spacing="4">HUSNI MARIKKAR</text>
<text x="300" y="772" font-family="Georgia,serif" font-size="10" fill="rgba(255,255,255,0.65)" text-anchor="middle" letter-spacing="3">ARCHITECT &amp; PROJECT MANAGER · LONDON</text>
</svg>