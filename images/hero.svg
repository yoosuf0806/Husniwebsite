<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C5BAB0"/>
      <stop offset="50%" style="stop-color:#9E9288"/>
      <stop offset="100%" style="stop-color:#7A6E65"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="60%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B2A4A;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#1B2A4A;stop-opacity:0.5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <!-- Architectural line elements -->
  <rect x="80" y="120" width="180" height="240" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="90" y="130" width="160" height="220" fill="rgba(255,255,255,0.05)" stroke="none"/>
  <line x1="80" y1="200" x2="260" y2="200" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="80" y1="270" x2="260" y2="270" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="300" y="180" width="220" height="300" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="310" y="190" width="200" height="280" fill="rgba(255,255,255,0.04)"/>
  <line x1="300" y1="280" x2="520" y2="280" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="300" y1="360" x2="520" y2="360" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Gold accent bar -->
  <rect x="80" y="560" width="3" height="80" fill="#C9A96E"/>
  <text x="100" y="585" font-family="Georgia,serif" font-size="18" fill="rgba(255,255,255,0.6)" letter-spacing="2">HUSNI MARIKKAR</text>
  <text x="100" y="610" font-family="Georgia,serif" font-size="13" fill="rgba(255,255,255,0.4)" letter-spacing="1">ARCHITECT</text>
  <rect width="600" height="800" fill="url(#overlay)"/>
</svg>